# Fixture for cajeX's check templates (RFC 20 tracks B and C). Runs only by hand, and never has.
# The build attests its provenance and makes an SBOM; actions are pinned to a commit; the token reads only.
name: release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: tar czf dist.tgz src
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist.tgz
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: src
          format: spdx-json
          output-file: dist.tgz.spdx.json
